<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uni Schedule Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-nav">
        <div class="brand" data-i18n="appTitle">Schedule Builder</div>
        <div class="lang-switcher">
            <span id="lang-en" class="active">EN</span> | <span id="lang-pt">PT</span>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <!-- Mode Toggle -->
            <div class="mode-selector">
                <button id="mode-custom" class="active" data-i18n="modeDream">Dream Schedule</button>
                <button id="mode-official" data-i18n="modeOfficial">Official Agroupment</button>
            </div>

            <h2 data-i18n="availableClasses">Available Classes (T & TP)</h2>
            <div id="class-list" class="class-list">
                <!-- JavaScript populates this -->
            </div>

            <div class="checkout-section">
                <h2 data-i18n="bestMatchTitle">Best Agroupment Match</h2>
                <p id="match-result" class="match-highlight">None selected</p>
                
                <h2 data-i18n="regCodes">Registration Codes</h2>
                <textarea id="checkout-codes" readonly rows="3" placeholder="..."></textarea>
                <button id="clear-btn" data-i18n="clearBtn">Clear Schedule</button>
            </div>
        </aside>

        <main class="calendar-container">
            <div class="calendar" id="calendar">
                <div class="header time-col" data-i18n="time">Time</div>
                <div class="header" data-i18n="mon">Mon</div>
                <div class="header" data-i18n="tue">Tue</div>
                <div class="header" data-i18n="wed">Wed</div>
                <div class="header" data-i18n="thu">Thu</div>
                <div class="header" data-i18n="fri">Fri</div>
                <!-- Time slots generated by JS -->
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
