<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uni Schedule Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-nav">
        <div class="brand" data-i18n="appTitle">Schedule Builder</div>
        
        <div class="subject-selector">
            <label for="subject-dropdown" data-i18n="selectSubject">Select Subject:</label>
            <select id="subject-dropdown">
                <!-- JS will populate subjects -->
            </select>
        </div>

        <div class="lang-switcher">
            <span id="lang-en" class="active">EN</span> | <span id="lang-pt">PT</span>
        </div>
    </header>

    <div class="main-layout">
        <!-- 1. Exploration Calendar (Top) -->
        <section class="calendar-section">
            <h2 data-i18n="exploreTitle">1. Explore Classes (Click + to Add)</h2>
            <div class="calendar-scroll">
                <div class="calendar" id="calendar-explore">
                    <!-- JS injects grid and headers here -->
                </div>
            </div>
        </section>

        <!-- 2. Dream Calendar (Middle) -->
        <section class="calendar-section">
            <h2 data-i18n="dreamTitle">2. Your Custom Schedule (Click - to Remove)</h2>
            <div class="calendar-scroll">
                <div class="calendar" id="calendar-dream">
                    <!-- JS injects grid and headers here -->
                </div>
            </div>
        </section>

        <hr class="separator">

        <!-- 3. Official Agroupment & Checkout (Bottom) -->
        <section class="bottom-section">
            <div class="official-calendar-wrapper">
                <h2><span data-i18n="officialTitle">3. Official Match:</span> <span id="match-result" class="match-highlight" data-i18n="noneSelected">None selected</span></h2>
                <div class="calendar-scroll">
                    <div class="calendar" id="calendar-official">
                        <!-- JS injects grid and headers here -->
                    </div>
                </div>
            </div>
            
            <div class="checkout-wrapper">
                <h2 data-i18n="regCodes">Registration Codes</h2>
                <p data-i18n="copyPrompt">Copy these on Aug 31st at 17:00:</p>
                <textarea id="checkout-codes" readonly placeholder="Select classes above..."></textarea>
                <button id="clear-btn" data-i18n="clearBtn">Clear Entire Schedule</button>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
